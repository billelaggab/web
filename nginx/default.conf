# الوكيل العكسي — المنفذ الوحيد المكشوف على المنظومة.
# لا يمرر أي طلب إلى الشبكة الداخلية إلا عبر upstream موحّد، ويضيف ترويسات أمان.

upstream icims_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # حد أقصى لحجم الرفع الجماعي (multipart) بما يوافق 25 ملفاً.
    client_max_body_size 800m;
    client_body_timeout 300s;

    # ترويسات الأمان
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # منع الوصول لملفات النظام والنسخ الاحتياطية إن وُجدت في صورة الواجهة.
    location ~* /(\.|env|git) {
        deny all;
        return 404;
    }

    # ملفات الوسائط تُبث عبر التطبيق فقط (رموز موقّعة) — لا تُخدم من القرص مباشرة.
    location /api/documents/ {
        proxy_pass http://icims_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://icims_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
